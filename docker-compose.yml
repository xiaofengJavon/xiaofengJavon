version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: subscription_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-subscription_platform}
      MYSQL_USER: ${DB_USERNAME:-sp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sp_pass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sp_network

  redis:
    image: redis:7.2-alpine
    container_name: subscription_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sp_network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: subscription_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-subscription_platform}
      DB_USERNAME: ${DB_USERNAME:-sp_user}
      DB_PASSWORD: ${DB_PASSWORD:-sp_pass123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_MINIAPP_APPID: ${WECHAT_MINIAPP_APPID}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET}
      WECHAT_PAY_APPID: ${WECHAT_PAY_APPID}
      WECHAT_PAY_MCHID: ${WECHAT_PAY_MCHID}
      WECHAT_PAY_MCH_KEY: ${WECHAT_PAY_MCH_KEY}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FILE_UPLOAD_DIR: /app/uploads
      FILE_BASE_URL: ${FILE_BASE_URL}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/var/log/subscription-platform
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sp_network

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  sp_network:
    driver: bridge
