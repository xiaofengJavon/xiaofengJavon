spring:
  application:
    name: subscription-platform
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false

  data:
    redis:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:subscription-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: 604800000

wechat:
  miniapp:
    appid: ${WECHAT_MINIAPP_APPID}
    secret: ${WECHAT_MINIAPP_SECRET}
  pay:
    appid: ${WECHAT_PAY_APPID:your-pay-appid}
    mchid: ${WECHAT_PAY_MCHID:your-mchid}
    mch-key: ${WECHAT_PAY_MCH_KEY:your-mch-key}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://your-domain.com/api/v1/payment/callback}
    key-path: ${WECHAT_PAY_KEY_PATH:classpath:cert/apiclient_cert.p12}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-pro

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
  base-url: ${FILE_BASE_URL:http://localhost:8080}

logging:
  level:
    com.subscription.platform: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false
